<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Art</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #art { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<script>
(function () {
  'use strict';

  /* ---------- basics ---------- */

  var LW = 540, LH = 960;
  var TAU = Math.PI * 2;

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function now() {
    return (window.performance && window.performance.now) ? window.performance.now() : new Date().getTime();
  }

  function mul32(a, b) {
    var ah = (a >>> 16) & 0xffff, al = a & 0xffff;
    return ((al * b) + (((ah * b) & 0xffff) << 16)) >>> 0;
  }

  function hash32(x) {
    x = x >>> 0;
    x ^= x >>> 16; x = mul32(x, 0x7feb352d);
    x ^= x >>> 15; x = mul32(x, 0x846ca68b);
    x ^= x >>> 16;
    return x >>> 0;
  }

  /* Seeded PRNG (mulberry32) with rand(min, max) / pick(arr) helpers */
  function Rng(seed) { this.s = hash32(seed); }
  Rng.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    var t = this.s;
    t = mul32(t ^ (t >>> 15), t | 1);
    t ^= t + mul32(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.rand = function (a, b) { return a + (b - a) * this.next(); };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  Rng.prototype.shuffle = function (arr) {
    var a = arr.slice(), i, j, tmp;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(this.next() * (i + 1)); tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
    return a;
  };

  /* ---------- colour helpers ---------- */

  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) { h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2); }
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbStr(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
  function rgbaStr(c, a) { return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')'; }
  function mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function lum(c) {
    var v = [c[0] / 255, c[1] / 255, c[2] / 255], i;
    for (i = 0; i < 3; i++) { v[i] = v[i] <= 0.03928 ? v[i] / 12.92 : Math.pow((v[i] + 0.055) / 1.055, 2.4); }
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function ink(hex, a) { var c = hexToRgb(hex); return { c: c, a: a, s: rgbaStr(c, a) }; }

  /* Paper / wash / accent / ink palettes */
  var PALETTES = [
    { paper: '#F2B7C7', washes: ['#EF6D95', '#D27DB8', '#8B8CE0'], accents: ['#2B8A7D', '#2A7FB2', '#7FAE62'], ink: ['#2D2D2D', '#242424'] },
    { paper: '#F1E1C8', washes: ['#D97757', '#C4557E', '#7E78B6'], accents: ['#2E7C7A', '#2F6FB0', '#6FA56D'], ink: ['#2A2A2A', '#3B3230'] },
    { paper: '#EEE7F2', washes: ['#B58AD5', '#F06B8C', '#6F92D6'], accents: ['#2C7C74', '#2A6BAA', '#7DA15A'], ink: ['#232323', '#2F2A2A'] },
    { paper: '#D4E4ED', washes: ['#5B8FB9', '#7A6FB8', '#8B78C2'], accents: ['#E07B6A', '#D4A373', '#6BA37B'], ink: ['#1E2A36', '#2A2A3A'] },
    { paper: '#C9D8E8', washes: ['#4A7BA7', '#6B5DA8', '#8E6BB8'], accents: ['#D4856A', '#C9A86A', '#5A9A6A'], ink: ['#1A2632', '#252535'] },
    { paper: '#E0E8F0', washes: ['#6A8FC4', '#8B7AC8', '#5A7EB8'], accents: ['#C97A6A', '#B89A5A', '#6A9A7A'], ink: ['#222838', '#2A2A38'] },
    { paper: '#E5DCF0', washes: ['#9B7BC4', '#7B6BB8', '#6A8AC4'], accents: ['#D98A6A', '#8AB87A', '#5A9AAA'], ink: ['#2A2438', '#322A3A'] },
    { paper: '#DDD4E8', washes: ['#8A6AB4', '#6A5AA8', '#7A8AC0'], accents: ['#CA7A5A', '#7AAA6A', '#5A8A9A'], ink: ['#28223A', '#302838'] },
    { paper: '#D0DCE8', washes: ['#4A6A9A', '#6A5A98', '#5A7AAA'], accents: ['#BA7A6A', '#9AAA6A', '#6A8AAA'], ink: ['#1A2232', '#222A3A'] }
  ];

  /* Five-colour palettes, first entry is the background / paper */
  var P5 = [
    [[236, 226, 208], [222, 94, 64], [39, 62, 94], [240, 180, 60], [27, 27, 27]],
    [[20, 24, 40], [255, 111, 97], [255, 214, 165], [96, 166, 180], [240, 240, 235]],
    [[245, 238, 225], [46, 105, 90], [216, 140, 88], [30, 40, 48], [200, 190, 170]],
    [[12, 12, 18], [120, 80, 255], [255, 90, 180], [60, 220, 255], [250, 250, 250]],
    [[238, 232, 220], [180, 50, 50], [30, 30, 30], [220, 190, 90], [110, 140, 120]],
    [[25, 40, 60], [240, 200, 120], [220, 110, 80], [120, 170, 190], [245, 235, 220]],
    [[250, 246, 238], [20, 60, 120], [240, 90, 40], [250, 200, 40], [30, 30, 30]],
    [[16, 16, 16], [230, 60, 60], [240, 240, 240], [60, 60, 60], [200, 160, 60]]
  ];

  /* Paper + three inks picked from a palette (inkA, inkB, inkTint) */
  function makeInkData(rng) {
    var pal = rng.pick(PALETTES);
    var d = {
      pal: pal,
      paper: { c: hexToRgb(pal.paper), s: pal.paper },
      inkA: ink(rng.pick(pal.ink), 0.96),
      inkB: ink(rng.pick(pal.ink), 0.92)
    };
    var tint = rng.rand(0, 1) < 0.32 ? rng.pick(pal.accents) : '#2B2B2B';
    d.inkTint = ink(tint, 0.70);
    /* occasional colourful variant: an accent and a wash join the inks */
    if (rng.rand(0, 1) < 0.3) {
      d.inkTint = ink(rng.pick(pal.accents), 0.85);
      d.inkB = ink(rng.pick(pal.washes), 0.9);
    }
    return d;
  }

  /* Five-colour palette, sometimes derived from the paper/wash palettes; colours 1..4 shuffled */
  function makePal5(rng) {
    var p;
    if (rng.rand(0, 1) < 0.3) {
      var q = rng.pick(PALETTES);
      p = [hexToRgb(q.paper), hexToRgb(q.washes[0]), hexToRgb(q.accents[0]), hexToRgb(q.ink[0]), hexToRgb(q.washes[1])];
    } else {
      p = rng.pick(P5).slice();
    }
    return [p[0]].concat(rng.shuffle(p.slice(1)));
  }

  /* Invisible wandering point on a slow Lissajous path, replaces a cursor */
  function wanderer(rng, x0, x1, y0, y1) {
    var fx = rng.rand(0.05, 0.11), fy = rng.rand(0.04, 0.09);
    var px = rng.rand(0, TAU), py = rng.rand(0, TAU), px2 = rng.rand(0, TAU), py2 = rng.rand(0, TAU);
    return function (t) {
      var u = 0.5 + 0.5 * (0.8 * Math.sin(t * fx + px) + 0.2 * Math.sin(t * fx * 2.3 + px2));
      var v = 0.5 + 0.5 * (0.8 * Math.sin(t * fy + py) + 0.2 * Math.sin(t * fy * 1.7 + py2));
      return { x: x0 + (x1 - x0) * u, y: y0 + (y1 - y0) * v };
    };
  }

  /* Groups dots by colour + quantised alpha so each group is one fill */
  function Buckets() { this.list = []; this.map = {}; }
  Buckets.prototype.key = function (colorStr, alpha, step) {
    var a = Math.round(alpha / step) * step;
    if (a < step) { a = step; }
    var id = colorStr + '|' + a.toFixed(3);
    if (!this.map.hasOwnProperty(id)) { this.map[id] = this.list.length; this.list.push({ s: colorStr, a: a }); }
    return this.map[id];
  };

  function sortByKey(arr) { arr.sort(function (a, b) { return a.k - b.k; }); }

  function fillDots(ctx, dots, buckets, alphaFn) {
    var cur = -1, i, d;
    for (i = 0; i < dots.length; i++) {
      d = dots[i];
      if (d.k !== cur) {
        if (cur >= 0) { ctx.fill(); }
        cur = d.k;
        ctx.beginPath();
        ctx.fillStyle = buckets.list[cur].s;
        ctx.globalAlpha = alphaFn ? alphaFn(cur, buckets.list[cur].a) : buckets.list[cur].a;
      }
      if (d.rr > 0.1) {
        ctx.moveTo(d.px + d.rr, d.py);
        ctx.arc(d.px, d.py, d.rr, 0, TAU);
      }
    }
    if (cur >= 0) { ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  function ell(ctx, x, y, rx, ry, rot) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) { ctx.rotate(rot); }
    ctx.scale(rx, ry);
    ctx.moveTo(1, 0);
    ctx.arc(0, 0, 1, 0, TAU);
    ctx.restore();
  }

  function substeps(dt) { return Math.max(1, Math.min(3, Math.round(dt))); }

  /* ---------- squares: rounded-square grid, a pulsing wandering path, spring physics pushed by a drifting point ---------- */
  function styleSquares(env) {
    var ctx = env.ctx, rng = env.rng, D = env.data;
    var cellSize = rng.rand(32, 44), gap = Math.max(3, cellSize * 0.085), total = cellSize + gap;
    var corner = cellSize / 6;
    var cols = Math.ceil(LW / total) + 2, rows = Math.ceil(LH / total) + 2;
    var ox = -(cols * total - LW) / 2, oy = -(rows * total - LH) / 2;
    var path = {};
    function add(c, r) { if (c >= 0 && c < cols && r >= 0 && r < rows) { path[c + ',' + r] = 1; } }

    var cc = Math.floor(rng.rand(3, cols - 3)), cr = Math.floor(rng.rand(0, 3)), step, d, b, i;
    for (step = 0; step < rows + 15; step++) {
      if (cc >= 0 && cc < cols && cr >= 0 && cr < rows) {
        add(cc, cr);
        if (cc > 0) { add(cc - 1, cr); }
        if (cc < cols - 1) { add(cc + 1, cr); }
      }
      d = rng.rand(0, 1);
      if (d < 0.6) { cr++; }
      else if (d < 0.8) { cc = Math.max(2, cc - 1); if (rng.rand(0, 1) > 0.3) { cr++; } }
      else { cc = Math.min(cols - 3, cc + 1); if (rng.rand(0, 1) > 0.3) { cr++; } }
    }
    var keys = Object.keys(path);
    for (b = 0; b < 10; b++) {
      var parts = rng.pick(keys).split(',');
      var bc = +parts[0], br = +parts[1], len = Math.floor(rng.rand(3, 10));
      for (i = 0; i < len; i++) {
        add(bc, br);
        d = rng.rand(0, 4);
        if (d < 1) { br--; } else if (d < 2) { br++; } else if (d < 3) { bc++; } else { bc--; }
      }
    }

    var cells = [], pathCells = [], buckets = new Buckets(), r, c;
    for (r = 0; r < rows; r++) {
      for (c = 0; c < cols; c++) {
        var isPath = !!path[c + ',' + r], v = rng.rand(0, 1);
        var col = isPath ? (v > 0.5 ? D.inkA : D.inkB) : (v > 0.5 ? D.inkTint : D.inkA);
        var cell = { hx: ox + c * total, hy: oy + r * total, x: 0, y: 0, vx: 0, vy: 0, color: col.s, phase: rng.rand(0, TAU) };
        cell.x = cell.hx; cell.y = cell.hy;
        if (isPath) { pathCells.push(cell); } else { cell.k = buckets.key(col.s, 0.65, 0.05); cells.push(cell); }
      }
    }
    sortByKey(cells);
    var all = cells.concat(pathCells);
    var cursor = wanderer(rng, -40, LW + 40, -40, LH + 40);
    var repel = 4000, repelR = 100;

    function rr(x, y, w, h, q) {
      ctx.moveTo(x + q, y);
      ctx.lineTo(x + w - q, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + q);
      ctx.lineTo(x + w, y + h - q);
      ctx.quadraticCurveTo(x + w, y + h, x + w - q, y + h);
      ctx.lineTo(x + q, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - q);
      ctx.lineTo(x, y + q);
      ctx.quadraticCurveTo(x, y, x + q, y);
      ctx.closePath();
    }

    return function (t, dt) {
      var m = cursor(t), n = substeps(dt), s, j, ce, dx, dy, dist, f, cur = -1;
      for (s = 0; s < n; s++) {
        for (j = 0; j < all.length; j++) {
          ce = all[j];
          ce.vx += (ce.hx - ce.x) * 0.1;
          ce.vy += (ce.hy - ce.y) * 0.1;
          dx = ce.x + cellSize / 2 - m.x; dy = ce.y + cellSize / 2 - m.y;
          if (Math.abs(dx) < repelR && Math.abs(dy) < repelR) {
            dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < repelR && dist > 0) {
              f = repel / (dist * dist);
              if (f > 12) { f = 12; }
              ce.vx += dx / dist * f; ce.vy += dy / dist * f;
            }
          }
          ce.vx *= 0.8; ce.vy *= 0.8;
          ce.x += ce.vx; ce.y += ce.vy;
        }
      }
      ctx.fillStyle = D.paper.s;
      ctx.fillRect(0, 0, LW, LH);
      for (j = 0; j < cells.length; j++) {
        ce = cells[j];
        if (ce.k !== cur) {
          if (cur >= 0) { ctx.fill(); }
          cur = ce.k; ctx.beginPath();
          ctx.fillStyle = buckets.list[cur].s; ctx.globalAlpha = buckets.list[cur].a;
        }
        rr(ce.x, ce.y, cellSize, cellSize, corner);
      }
      if (cur >= 0) { ctx.fill(); }
      for (j = 0; j < pathCells.length; j++) {
        ce = pathCells[j];
        ctx.beginPath();
        rr(ce.x, ce.y, cellSize, cellSize, corner);
        ctx.fillStyle = ce.color;
        ctx.globalAlpha = 0.75 + 0.2 * (Math.sin(t * 2 + ce.phase) + 1) / 2;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };
  }

  /* ---------- pointillist: swirling cloud of dots with spring physics ---------- */
  function stylePointillist(env) {
    var ctx = env.ctx, rng = env.rng, D = env.data;
    var sx = LW / 100, sy = LH / 100, smin = Math.min(sx, sy);
    var twistA = rng.rand(0.07, 0.13), twistB = rng.rand(0.1, 0.2);
    var spreadX = rng.rand(0.75, 0.95), spreadY = rng.rand(0.5, 0.7);
    var dots = [], buckets = new Buckets(), i;
    function addDot(hx, hy, r, col, op) {
      dots.push({ hx: hx, hy: hy, px: hx, py: hy, vx: 0, vy: 0, rr: r, k: buckets.key(col.s, op, 0.1) });
    }
    var main = Math.floor(rng.rand(700, 900));
    for (i = 0; i < main; i++) {
      var ang = rng.rand(0, TAU), dist = rng.rand(0, 50);
      var cx = 50 + Math.cos(ang + dist * twistA) * dist * spreadX;
      var cy = 50 + Math.sin(ang + dist * twistB) * dist * spreadY;
      var dfc = Math.sqrt((cx - 50) * (cx - 50) + (cy - 50) * (cy - 50));
      var sv = Math.max(0.3, 1 - dfc / 60);
      addDot((cx + rng.rand(-5, 5)) * sx, (cy + rng.rand(-5, 5)) * sy, rng.rand(0.3, 1.2) * sv * smin,
        rng.pick([D.inkA, D.inkB, D.inkTint, D.inkA, D.inkB]), rng.rand(0.4, 0.9));
    }
    for (i = 0; i < 300; i++) {
      addDot(rng.rand(0, 100) * sx, rng.rand(0, 100) * sy, rng.rand(0.2, 0.6) * smin,
        rng.pick([D.inkA, D.inkB, D.inkTint]), rng.rand(0.2, 0.5));
    }
    sortByKey(dots);
    var cursor = wanderer(rng, -30, LW + 30, LH * 0.1, LH * 0.9);

    return function (t, dt) {
      var m = cursor(t), n = substeps(dt), s, j, d, dx, dy, dd, f;
      for (s = 0; s < n; s++) {
        for (j = 0; j < dots.length; j++) {
          d = dots[j];
          d.vx += (d.hx - d.px) * 0.08; d.vy += (d.hy - d.py) * 0.08;
          dx = d.px - m.x; dy = d.py - m.y;
          if (dx < 120 && dx > -120 && dy < 120 && dy > -120) {
            dd = Math.sqrt(dx * dx + dy * dy);
            if (dd < 120 && dd > 0) { f = Math.min(10, 3000 / (dd * dd)); d.vx += dx / dd * f; d.vy += dy / dd * f; }
          }
          d.vx *= 0.85; d.vy *= 0.85;
          d.px += d.vx; d.py += d.vy;
        }
      }
      ctx.fillStyle = D.paper.s;
      ctx.fillRect(0, 0, LW, LH);
      fillDots(ctx, dots, buckets);
    };
  }

  /* ---------- pointillist2: freely floating, wobbling dots of three sizes ---------- */
  function stylePointillist2(env) {
    var ctx = env.ctx, rng = env.rng, D = env.data;
    var dots = [], buckets = new Buckets(), i, phases = [];
    var speedMul = rng.rand(0.8, 1.3);
    function group(n, sp0, sp1, r0, r1, cols, o0, o1, w0, w1) {
      for (var k = 0; k < n; k++) {
        var a = rng.rand(0, TAU);
        dots.push({
          px: rng.rand(0, LW), py: rng.rand(0, LH), rr: rng.rand(r0, r1),
          sp: rng.rand(sp0, sp1) * speedMul, ang: a, wp: rng.rand(0, TAU), ws: rng.rand(w0, w1),
          k: buckets.key(rng.pick(cols).s, rng.rand(o0, o1), 0.1)
        });
      }
    }
    group(Math.floor(rng.rand(500, 650)), 0.1, 0.5, 1, 4, [D.inkA, D.inkB, D.inkTint], 0.3, 0.8, 0.5, 2);
    group(50, 0.05, 0.2, 4, 8, [D.inkA, D.inkB], 0.2, 0.5, 0.2, 0.8);
    group(200, 0.2, 0.8, 0.5, 1.5, [D.inkA, D.inkB, D.inkTint], 0.15, 0.4, 1, 3);
    sortByKey(dots);
    for (i = 0; i < buckets.list.length; i++) { phases.push(rng.rand(0, TAU)); }

    return function (t, dt) {
      var j, d, a;
      for (j = 0; j < dots.length; j++) {
        d = dots[j];
        a = d.ang + Math.sin(t * d.ws + d.wp) * 0.3;
        d.px += Math.cos(a) * d.sp * dt;
        d.py += Math.sin(a) * d.sp * dt;
        if (d.px < -d.rr) { d.px = LW + d.rr; } else if (d.px > LW + d.rr) { d.px = -d.rr; }
        if (d.py < -d.rr) { d.py = LH + d.rr; } else if (d.py > LH + d.rr) { d.py = -d.rr; }
      }
      ctx.fillStyle = D.paper.s;
      ctx.fillRect(0, 0, LW, LH);
      fillDots(ctx, dots, buckets, function (k, base) { return base * (0.9 + Math.sin(t * 0.5 + phases[k]) * 0.1); });
    };
  }

  /* ---------- metricwave: fingerprint-like radial displacement of a dot grid, centre drifts ---------- */
  function styleMetricwave(env) {
    var ctx = env.ctx, rng = env.rng, D = env.data;
    var spacing = rng.rand(16, 21), baseRadius = spacing * 0.25;
    var frequency = rng.rand(0.010, 0.015), amplitude = rng.rand(18, 26), breathe = rng.rand(1.6, 2.4);
    var cols = Math.ceil(LW / spacing) + 4, rows = Math.ceil(LH / spacing) + 4;
    var dots = [], buckets = new Buckets(), r, c;
    for (r = 0; r < rows; r++) {
      for (c = 0; c < cols; c++) {
        var gx = -spacing * 2 + c * spacing, gy = -spacing * 2 + r * spacing;
        var dx = gx - LW / 2, dy = gy - LH / 2;
        var sv = 0.85 + 0.3 * Math.sin(Math.sqrt(dx * dx + dy * dy) * 0.005);
        dots.push({
          gx: gx + rng.rand(-1, 1), gy: gy + rng.rand(-1, 1), br: (baseRadius + rng.rand(-0.5, 0.5)) * sv,
          px: 0, py: 0, rr: 0,
          k: buckets.key(rng.pick([D.inkA, D.inkB, D.inkTint]).s, 0.6 + rng.rand(0, 0.3), 0.1)
        });
      }
    }
    sortByKey(dots);
    var cursor = wanderer(rng, LW * 0.1, LW * 0.9, LH * 0.15, LH * 0.85);
    var center = { x: LW / 2, y: LH / 2 };

    return function (t, dt) {
      var m = cursor(t), e = 1 - Math.pow(1 - 0.04, dt), j, d, dx, dy, dist, push, inv;
      center.x += (m.x - center.x) * e;
      center.y += (m.y - center.y) * e;
      for (j = 0; j < dots.length; j++) {
        d = dots[j];
        dx = d.gx - center.x; dy = d.gy - center.y;
        dist = Math.sqrt(dx * dx + dy * dy);
        push = Math.sin(dist * frequency) * amplitude;
        inv = dist > 0 ? push / dist : 0;
        d.px = d.gx + dx * inv;
        d.py = d.gy + dy * inv;
        d.rr = d.br * (0.5 + 0.5 * (Math.sin(t * breathe + dist * 0.008) + 1) / 2);
      }
      ctx.fillStyle = D.paper.s;
      ctx.fillRect(0, 0, LW, LH);

    var stripeCols = [rgbStr(skyBot), rgbStr(all[rest[2]]), rgbStr(mixRgb(sun, skyBot, 0.35)), rgbStr(all[rest[3]])];
    var horizon = LH * rng.rand(0.6, 0.64), sunR = LW * rng.rand(0.22, 0.3), sunX = LW * rng.rand(0.35, 0.65);
    var period = rng.rand(80, 140), sunPh = rng.rand(0, TAU), nStripes = Math.floor(rng.rand(13, 18));
    var flow = rng.rand(0.05, 0.1), expo = rng.rand(1.5, 1.9);
    var sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, rgbStr(skyTop));
    sky.addColorStop(1, rgbStr(skyBot));
    var sunS = rgbStr(sun);

    return function (t) {
      var sunY = LH * (0.39 + 0.1 * Math.sin(t * TAU / period + sunPh));
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, LW, horizon + 1);
      var glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.8, sunX, sunY, sunR * 2.4);
      glow.addColorStop(0, rgbaStr(sun, 0.3));
      glow.addColorStop(1, rgbaStr(sun, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, LW, horizon);
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR, 0, TAU);
      ctx.fillStyle = sunS;
      ctx.fill();
      ctx.fillStyle = rgbStr(waterBase);
      ctx.fillRect(0, horizon, LW, LH - horizon);
      var s = t * flow, base = Math.floor(s), frac = s - base, depth = LH - horizon;
      var vis = Math.max(0, Math.min(1, (horizon - (sunY - sunR)) / (sunR * 2)));
      for (i = -1; i < nStripes; i++) {
        var u0 = (i + frac) / nStripes, u1 = (i + 1 + frac) / nStripes;
        if (u1 <= 0) { continue; }
        if (u0 < 0) { u0 = 0; }
        var y0 = horizon + depth * Math.pow(u0, expo), y1 = horizon + depth * Math.pow(u1, expo);
        var th = (y1 - y0) * 0.55;
        if (th < 0.6) { th = 0.6; }
        ctx.fillStyle = stripeCols[((i - base) % 4 + 4) % 4];
        ctx.fillRect(0, y0, LW, th);
        var rw = sunR * (1.3 - u0 * 0.6) * (0.75 + 0.25 * Math.sin(t * 0.7 + i * 1.7)) * vis;
        if (rw > 1) {
          ctx.fillStyle = sunS;
          ctx.globalAlpha = 0.55;
          ctx.fillRect(sunX - rw, y0 + th * 0.15, rw * 2, th * 0.7);
          ctx.globalAlpha = 1;
        }
      }
    };
  }

  /* ---------- contours: concentric slightly elliptical rings rippling outward ---------- */
  function styleContours(env) {
    var ctx = env.ctx, rng = env.rng, P = env.pal5;
    var bg = rgbStr(P[0]), cols = P.slice(1).map(rgbStr);
    var cx0 = LW * rng.rand(0.2, 0.8), cy0 = LH * rng.rand(0.2, 0.8);
    var ratio = rng.rand(0.82, 0.96), rot0 = rng.rand(0, Math.PI);
    var far = 0, cs = [[0, 0], [LW, 0], [0, LH], [LW, LH]], i;
    for (i = 0; i < 4; i++) { far = Math.max(far, Math.sqrt(Math.pow(cs[i][0] - cx0, 2) + Math.pow(cs[i][1] - cy0, 2))); }
    var N = 60, spacing = Math.max(12, far / ratio / (N - 2));
    var flow = rng.rand(0.12, 0.25), lw = 5, wob = rng.rand(1.5, 3.5);

    return function (t) {
      var s = t * flow, base = Math.floor(s), frac = s - base;
      var cx = cx0 + Math.sin(t * 0.05) * 10, cy = cy0 + Math.cos(t * 0.043) * 10, rot = rot0 + t * 0.01;
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, LW, LH);
      ctx.lineWidth = lw;
      for (i = 0; i < N; i++) {
        var r = (i + frac) * spacing + Math.sin(i * 0.45 - t * 0.6) * wob;
        if (r < 1) { continue; }
        ctx.beginPath();
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rot);
        ctx.scale(1, ratio);
        ctx.moveTo(r, 0);
        ctx.arc(0, 0, r, 0, TAU);
        ctx.restore();
        ctx.strokeStyle = cols[((i - base) % 4 + 4) % 4];
        ctx.stroke();
      }
    };
  }

  /* ---------- stripes: scrolling 45 degree stripes behind a paper disc holding a dark disc ---------- */
  function styleStripes(env) {
    var ctx = env.ctx, rng = env.rng, P = env.pal5;
    var bg = P[0], others = P.slice(1), i, dark = others[0];
    for (i = 1; i < others.length; i++) {
      if (Math.abs(lum(others[i]) - lum(bg)) > Math.abs(lum(dark) - lum(bg))) { dark = others[i]; }
    }
    var stripeCols = [];
    for (i = 0; i < others.length && stripeCols.length < 3; i++) { if (others[i] !== dark) { stripeCols.push(rgbStr(others[i])); } }
    var pitch = 45, sw = 22, dir = rng.rand(0, 1) < 0.5 ? 1 : -1, speed = rng.rand(3, 6);
    var bigR = LW * rng.rand(0.3, 0.4), bx = LW * rng.rand(0.35, 0.65), by = LH * rng.rand(0.3, 0.7);
    var smallR = bigR * rng.rand(0.32, 0.5), sa = rng.rand(0, TAU), so = (bigR - smallR) * rng.rand(0.2, 0.6);
    var diag = Math.sqrt(LW * LW + LH * LH), bgS = rgbStr(bg), darkS = rgbStr(dark);

    return function (t) {
      var off = (t * speed) % (pitch * 3), k, n = Math.ceil(diag / pitch) + 4;
      ctx.fillStyle = bgS;
      ctx.fillRect(0, 0, LW, LH);
      ctx.save();
      ctx.translate(LW / 2, LH / 2);
      ctx.rotate(dir * Math.PI / 4);
      for (k = -n; k <= n; k++) {
        ctx.fillStyle = stripeCols[((k % 3) + 3) % 3];
        ctx.fillRect(k * pitch + off - sw / 2, -diag / 2, sw, diag);
      }
      ctx.restore();
      var br = bigR * (1 + 0.02 * Math.sin(t * 0.3));
      var cx = bx + Math.sin(t * 0.07) * 8, cy = by + Math.cos(t * 0.05) * 10;
      ctx.beginPath();
      ctx.arc(cx, cy, br, 0, TAU);
      ctx.fillStyle = bgS;
      ctx.fill();
      var a = sa + t * 0.05;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * so, cy + Math.sin(a) * so, smallR * (1 + 0.04 * Math.sin(t * 0.5 + 1)), 0, TAU);
      ctx.fillStyle = darkS;
      ctx.fill();
    };
  }

  /* ---------- registry ---------- */

  var STYLES = [
    { id: 'squares', name: 'Wandering Squares', make: styleSquares },
    { id: 'pointillist', name: 'Pointillist Swirl', make: stylePointillist },
    { id: 'pointillist2', name: 'Drifting Dots', make: stylePointillist2 },
    { id: 'metricwave', name: 'Metric Wave', make: styleMetricwave },
    { id: 'fabric', name: 'Breathing Fabric', make: styleFabric },
    { id: 'cone', name: 'Light Cone', make: styleCone },
    { id: 'surf', name: 'Surf', make: styleSurf },
    { id: 'watercolor', name: 'Watercolor Wash', make: styleWatercolor },
    { id: 'blocks', name: 'Bauhaus Blocks', make: styleBlocks },
    { id: 'sunset', name: 'Striped Sunset', make: styleSunset },
    { id: 'contours', name: 'Contour Rings', make: styleContours },
    { id: 'stripes', name: 'Diagonal Stripes', make: styleStripes }
  ];

  window.ART_STYLES = [];
  var byId = {}, si;
  for (si = 0; si < STYLES.length; si++) {
    window.ART_STYLES.push({ id: STYLES[si].id, name: STYLES[si].name });
    byId[STYLES[si].id] = STYLES[si];
  }

  /* ---------- setup ---------- */

  var seedParam = qs('seed'), styleParam = qs('style'), scaleParam = qs('scale');
  var seed = (seedParam !== null && /^-?\d+$/.test(seedParam)) ? (parseInt(seedParam, 10) >>> 0) : Math.floor(Math.random() * 4294967296);
  var style = byId[styleParam];
  if (!style) {
    // ?styles=a,b,c limits the random choice to those styles (unknown ids are ignored)
    var pool = [], wanted = (qs('styles') || '').split(',');
    for (var wi = 0; wi < wanted.length; wi++) { if (byId[wanted[wi]]) pool.push(byId[wanted[wi]]); }
    if (!pool.length) pool = STYLES;
    style = (seedParam !== null) ? pool[Math.floor(new Rng(seed ^ 0x5bd1e995).next() * pool.length)]
      : pool[Math.floor(Math.random() * pool.length)];
  }
  var S = scaleParam === '1' ? 2 : 1;

  var canvas = document.getElementById('art');
  canvas.width = LW * S;
  canvas.height = LH * S;
  var ctx = canvas.getContext('2d');

  function fit() {
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var k = Math.max(vw / LW, vh / LH), w = Math.ceil(LW * k), h = Math.ceil(LH * k);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.style.left = Math.floor((vw - w) / 2) + 'px';
    canvas.style.top = Math.floor((vh - h) / 2) + 'px';
  }
  fit();
  window.addEventListener('resize', fit, false);

  var env = {
    ctx: ctx, seed: seed,
    rng: new Rng(seed),
    data: makeInkData(new Rng(seed + 1)),
    pal5: makePal5(new Rng(seed + 2))
  };
  var draw = style.make(env);

  window.ART_CURRENT = { id: style.id, name: style.name, seed: seed };
  window.ART_STATS = { frames: 0, totalMs: 0, maxMs: 0 };

  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
    function (cb) { return window.setTimeout(function () { cb(now()); }, 33); };

  var startT = null, lastT = 0, FRAME_MS = 1000 / 30 - 2;

  function tick() {
    raf(tick);
    var tnow = now();
    if (startT === null) { startT = tnow; lastT = tnow - 1000 / 30; }
    if (tnow - lastT < FRAME_MS) { return; }
    var dt = Math.min(3, (tnow - lastT) / (1000 / 60));
    lastT = tnow;
    var t0 = now();
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.globalAlpha = 1;
    draw((tnow - startT) / 1000, dt);
    var ms = now() - t0;
    window.ART_STATS.frames++;
    window.ART_STATS.totalMs += ms;
    if (ms > window.ART_STATS.maxMs) { window.ART_STATS.maxMs = ms; }
  }
  tick();
})();
</script>
</body>
</html>
